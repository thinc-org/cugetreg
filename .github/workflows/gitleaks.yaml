# Scans every push/PR for hardcoded secrets. Second layer behind the
# pre-commit hook (.pre-commit-config.yaml) — catches anything that slips
# through because someone skipped the hook (--no-verify) or never
# installed it locally.
name: Gitleaks secret scan

on:
  pull_request:
    branches: [mvp1-dev, v2-beta, v2-prod]
  push:
    branches: [mvp1-dev, v2-beta, v2-prod]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the latest commit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
