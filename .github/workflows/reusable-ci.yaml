# Reusable CI workflow, install dependencies and run Nx target provied by projecy.json for each app
name: Reusable CI

on:
  workflow_call:
    inputs:
      target: # The target command to run via Nx, if not provided, it'll only install dependencies and then cache
        type: string
        required: false
      runs-on:
        type: string
        required: false
        default: ubuntu-latest

jobs:
  run:
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cugetreg?schema=public
      PUBLIC_API_URL: http://localhost:3000
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        name: Checkout
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        id: pnpm-install
        with:
          run_install: false

      - name: Setup node with cache
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Start PostgreSQL
        if: ${{ inputs.target == 'build' || inputs.target == 'test' || inputs.target == 'check' }}
        run: |
          docker compose -f apps/core/docker-compose.yaml up -d db
          for i in $(seq 1 30); do
            if docker exec cugetreg-db pg_isready -U postgres > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL failed to start"
          docker logs cugetreg-db --tail 20
          exit 1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cugetreg
          POSTGRES_PORT: 5432

      - name: Apply database migrations
        if: ${{ inputs.target == 'build' || inputs.target == 'test' || inputs.target == 'check' }}
        run: pnpm --filter @cugetreg/core exec prisma migrate deploy

      - name: Get branch name
        id: branch-name
        # Pinned to a SHA — tj-actions was the target of the Mar-2025 supply-chain
        # compromise (CVE-2025-30066); never float this on a tag.
        uses: tj-actions/branch-names@dde14ac574a8b9b1cedc59a1cf312788af43d8d8  # v8.2.1

      - name: Echo base branch name
        id: get-base-branch
        run: |
          BASE_BRANCH=${{ steps.branch-name.outputs.base_ref_branch || 'main' }}
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_OUTPUT

          if [ "$BASE_BRANCH" != "main" ]; then
            echo "TURBO_FILTER=--filter=...[origin/main]" >> $GITHUB_OUTPUT
          fi

      - name: Target
        if: ${{ inputs.target }}
        run: pnpm ${{ inputs.target }} ${{ steps.get-base-branch.outputs.TURBO_FILTER }}
