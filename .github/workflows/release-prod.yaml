# Prod release: publish a GitHub Release (creating its tag, e.g. vX.Y.Z, if it
# doesn't already exist). CI builds web + api with that version tag and opens
# a PR against the gitops prod overlay (so a human approves the prod rollout).
#
# A bare `git tag vX.Y.Z && git push origin vX.Y.Z` no longer triggers this —
# publish a Release from that tag in the GitHub UI (or `gh release create`).
name: Build & deploy prod

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

# Serialize prod releases so two tags can't race the gitops write-back.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # cugetregv2 releases must stay on major version 2 — reject anything else
  # (e.g. a stray v1.x.x tag) before it ever reaches build-deploy.
  guard-major-version:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce major version 2
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG##*@}"    # strip "web@" / "api@" prefix, if present
          VERSION="${VERSION#v}"  # strip leading "v", if present (e.g. v2.0.1)
          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" != "2" ]; then
            echo "::error::Release tag '$TAG' has major version '$MAJOR' — only major version 2 is allowed for cugetregv2 releases."
            exit 1
          fi
          echo "Major version check passed: $TAG (major=$MAJOR)"

  deploy:
    needs: guard-major-version
    uses: ./.github/workflows/build-deploy.yaml
    with:
      env: prod
      tag: ${{ github.event.release.tag_name }}     # e.g. web@2.0.4
      update-mode: pr
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
