# Reusable: build the api + web images, push to GHCR, then write the new tag
# back into the gitops repo (which ArgoCD then syncs).
#
# Called by build-beta.yaml (env=beta, commit) and release-prod.yaml (env=prod, PR).
#
# Naming map (app dir → image → gitops component):
#   apps/cugetreg → ghcr.io/narumedsr-p/web → gitops "web"  (match-name my-registry/web)
#   apps/core     → ghcr.io/narumedsr-p/api → gitops "api"  (match-name my-registry/api)
#
# Supply-chain note: third-party + first-party actions are pinned to a commit SHA
# (the trailing `# vX.Y.Z` is the human-readable tag the SHA corresponds to).
# Pin, don't float on tags — a moved tag can ship new code into our build.
name: _build-deploy

on:
  workflow_call:
    inputs:
      env:
        description: target environment / overlay (beta | prod)
        required: true
        type: string
      tag:
        description: image tag to build & deploy (e.g. beta-<sha> or v2.0.1)
        required: true
        type: string
      update-mode:
        description: how to write back to gitops (commit | pr)
        default: commit
        type: string
    secrets:
      GH_TOKEN:
        description: token with write access to the gitops repo
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NS: narumedsr-p
  GITOPS_REPO: narumedsr-p/cugetregv2-gitops
  GITOPS_REF: main

jobs:
  # ── web: self-contained build ───────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Expose the pushed image's content digest so update-gitops can pin by digest
    # (immutable) instead of by tag (which a registry push could later move).
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        id: build
        with:
          context: .
          file: apps/cugetreg/Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/web:${{ inputs.tag }}
          push: true
          # OCI source label → GHCR auto-links the package to this repo, so the
          # package inherits the repo's visibility/permissions (read access for
          # the ghcr-pull token) and links back to the commit that built it.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── api: needs TypedSQL codegen (prisma generate --sql) against a live DB ─────
  # The api Dockerfile COPYs a pre-generated src/generated/prisma/sql.ts and does
  # NOT regenerate it, so we must produce it here before docker build.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cugetreg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cugetreg?schema=public
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TypedSQL introspects the DB, so the schema must exist first.
      - name: Apply migrations
        working-directory: apps/core
        run: pnpm exec prisma migrate deploy
      - name: Generate Prisma client + TypedSQL (writes src/generated/prisma/sql.ts)
        working-directory: apps/core
        run: pnpm run codegen
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        id: build
        with:
          context: .
          file: apps/core/Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/api:${{ inputs.tag }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── write the new tag into the gitops repo ────────────────────────────────────
  update-gitops:
    needs: [web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_REF }}
          token: ${{ secrets.GH_TOKEN }}
      # Pin tag@digest: the tag stays human-readable in the values file, the
      # @sha256 digest makes the deploy reproducible and immune to a moved tag.
      - name: Bump image tags in Helm values for ${{ inputs.env }}
        run: |
          declare -A DIGEST=(
            [web]="${{ needs.web.outputs.digest }}"
            [api]="${{ needs.api.outputs.digest }}"
          )
          for comp in web api; do
            ref="${REGISTRY}/${IMAGE_NS}/$comp:${{ inputs.tag }}@${DIGEST[$comp]}"
            file="apps/$comp/values-${{ inputs.env }}.yaml"
            if [ ! -f "$file" ]; then
              echo "::error::$file not found — skipping $comp"
              continue
            fi
            sed -i "s|^image: ${REGISTRY}/${IMAGE_NS}/$comp:.*|image: $ref|" "$file"
            echo "bumped $comp → $ref"
          done
      - name: Write back (commit or PR)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MSG="deploy(${{ inputs.env }}): web,api → ${{ inputs.tag }}"
          if [ "${{ inputs.update-mode }}" = "pr" ]; then
            BR="deploy/${{ inputs.env }}-${{ inputs.tag }}"
            git switch -c "$BR"
            git commit -am "$MSG"
            git push origin "$BR"
            gh pr create --base "${GITOPS_REF}" --head "$BR" \
              --title "deploy(${{ inputs.env }}): ${{ inputs.tag }}" \
              --body "Automated image bump: web, api → \`${{ inputs.tag }}\`"
          else
            git commit -am "$MSG"
            # gitops main is shared: this repo AND the admin repo push image bumps
            # here, so concurrent runs race. Rebase-retry on non-fast-forward
            # rejection instead of failing the deploy.
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${GITOPS_REF}"; then
                echo "pushed on attempt $attempt"; exit 0
              fi
              echo "push rejected (attempt $attempt/5) — rebasing onto origin/${GITOPS_REF}"
              git fetch origin "${GITOPS_REF}"
              git rebase "origin/${GITOPS_REF}"
            done
            echo "::error::failed to push image bump after 5 attempts"; exit 1
          fi
