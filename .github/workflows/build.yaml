# Beta auto-deploy: every push to the `v2-beta` branch runs lint + test, and
# only if both pass builds web + api with an immutable tag (beta-<sha>) and
# commits the new tag into the gitops beta overlay (gitops `beta` branch).
# ArgoCD picks up the commit and syncs.
name: Build & deploy beta

on:
  push:
    branches: [v2-beta]

permissions:
  contents: read
  packages: write

# Serialize beta deploys: rapid pushes to `v2-beta` must not race each other
# into the gitops `beta` branch. cancel-in-progress:false → let an in-flight
# deploy finish (don't leave a half-written gitops commit) before the next runs.
concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  # ── gate: lint + test must pass before we build/push/deploy ──────────────────
  lint:
    uses: ./.github/workflows/reusable-ci.yaml
    secrets: inherit
    with:
      target: lint
  test:
    uses: ./.github/workflows/reusable-ci.yaml
    secrets: inherit
    with:
      target: test

  deploy:
    needs: [lint, test]
    uses: ./.github/workflows/build-deploy.yaml
    with:
      env: beta
      tag: beta-${{ github.sha }}
      update-mode: commit
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
