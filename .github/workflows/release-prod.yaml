# Prod release (manual semver): cut a release by tagging main with vX.Y.Z and
# pushing the tag. CI builds web + api with that version tag and opens a PR
# against the gitops prod overlay (so a human approves the prod rollout).
#
#   git tag v2.0.1 && git push origin v2.0.1
name: Build & deploy prod

on:
  push:
    tags:
      - "v*"

# Serialize prod releases so two tags can't race the gitops write-back.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/build-deploy.yaml
    with:
      env: prod
      tag: ${{ github.ref_name }}     # the git tag, e.g. v2.0.1
      update-mode: pr
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
