name: Continuous Integration
on:
  pull_request:

env:
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: USER_NAME
  DB_PASS: PASSWORD
  DB_NAME: DB_NAME
  DATABASE_URL: "postgresql://USER_NAME:PASSWORD@localhost:$5432/DB_NAME?schema=public"
  GOOGLE_CLIENT_ID: 123-XXX.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: BBBBBBB
  APP_MODE: dev
  BETTER_AUTH_SECRET: ABCdsfsvsdkjvdakj
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  install-deps:
    strategy:
      matrix:
        platform: [ubuntu-latest]

    uses: ./.github/workflows/reusable-ci.yaml
    secrets: inherit

  lint:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    needs: install-deps

    uses: ./.github/workflows/reusable-ci.yaml
    secrets: inherit
    with:
      target: lint
      runs-on: ${{ matrix.platform }}

  check:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    needs: install-deps

    uses: ./.github/workflows/reusable-ci.yaml
    secrets: inherit
    with:
      target: check
      runs-on: ${{ matrix.platform }}

  test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    needs: install-deps

    uses: ./.github/workflows/reusable-ci.yaml
    secrets: inherit
    with:
      target: test
      runs-on: ${{ matrix.platform }}

  build:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    needs: install-deps

    secrets: inherit
    uses: ./.github/workflows/reusable-ci.yaml
    with:
      target: build
      runs-on: ${{ matrix.platform }}
